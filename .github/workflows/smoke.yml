name: production-smoke

on:
  pull_request:
  push:
    branches:
      - main
    paths:
      - "install.sh"
      - "cmd/panel/**"
      - "internal/app/**"
      - "internal/dbmanager/**"
      - "internal/docker/**"
      - "internal/server/**"
      - "internal/state/**"
      - "internal/terminal/**"
      - ".github/workflows/smoke.yml"
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build smoke artifacts
        run: |
          mkdir -p smoke-dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -o smoke-dist/open-go-panel-linux-amd64 ./cmd/panel
          curl -fsSL https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css -o smoke-dist/xterm.css
          curl -fsSL https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.js -o smoke-dist/xterm.js
          curl -fsSL https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.js -o smoke-dist/xterm-addon-fit.js
          (cd smoke-dist && sha256sum open-go-panel-linux-amd64 xterm.css xterm.js xterm-addon-fit.js > SHA256SUMS)

      - name: Run local artifact server
        run: |
          python3 -m http.server 18080 --directory smoke-dist >/tmp/ogp-smoke-http.log 2>&1 &
          echo $! > /tmp/ogp-smoke-http.pid
          sleep 1
          curl -fsS http://127.0.0.1:18080/SHA256SUMS

      - name: Verify managed Go links are safe and idempotent
        shell: bash
        run: |
          set -euo pipefail
          bash -n ./install.sh
          # Execute the installer's function against isolated temporary paths.
          function_source="$(sed -n '/^ensure_managed_go_links() {/,/^}/p' ./install.sh)"
          test -n "$function_source"
          eval "$function_source"
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          mkdir -p "$tmp/go/bin" "$tmp/bin"
          for tool in go gofmt; do
            printf '#!/bin/sh\nexit 0\n' > "$tmp/go/bin/$tool"
            chmod 0755 "$tmp/go/bin/$tool"
          done
          ensure_managed_go_links "$tmp/go" "$tmp/bin"
          test "$(readlink "$tmp/bin/go")" = "$tmp/go/bin/go"
          test "$(readlink "$tmp/bin/gofmt")" = "$tmp/go/bin/gofmt"
          # Re-running must leave working links unchanged.
          ensure_managed_go_links "$tmp/go" "$tmp/bin"
          test "$(readlink "$tmp/bin/go")" = "$tmp/go/bin/go"
          # Respect an existing regular binary and a dangling symlink.
          rm "$tmp/bin/go" "$tmp/bin/gofmt"
          printf 'keep this binary\n' > "$tmp/bin/go"
          ln -s "$tmp/nonexistent" "$tmp/bin/gofmt"
          ensure_managed_go_links "$tmp/go" "$tmp/bin"
          test "$(cat "$tmp/bin/go")" = "keep this binary"
          test "$(readlink "$tmp/bin/gofmt")" = "$tmp/nonexistent"
          # Go is optional. Missing binaries must not create broken links.
          rm "$tmp/bin/go" "$tmp/bin/gofmt" "$tmp/go/bin/go" "$tmp/go/bin/gofmt"
          ensure_managed_go_links "$tmp/go" "$tmp/bin"
          test ! -e "$tmp/bin/go"
          test ! -L "$tmp/bin/go"
          test ! -e "$tmp/bin/gofmt"
          test ! -L "$tmp/bin/gofmt"

      - name: Install current build
        run: |
          sudo env \
            OGP_BINARY_URL=http://127.0.0.1:18080/open-go-panel-linux-amd64 \
            OGP_CHECKSUMS_URL=http://127.0.0.1:18080/SHA256SUMS \
            OGP_ASSET_BASE_URL=http://127.0.0.1:18080 \
            bash ./install.sh

      - name: Exercise panel
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS http://127.0.0.1:8443/health | grep -qx ok
          PASS="$(sudo sed -n 's/^OGP_ADMIN_PASSWORD=//p' /etc/open-go-panel/open-go-panel.env | head -n1)"
          LOGIN_CODE="$(curl -sS -o /dev/null -w '%{http_code}' -c /tmp/ogp-cookies -d "username=admin&password=$PASS" http://127.0.0.1:8443/login)"
          test "$LOGIN_CODE" = "303"
          curl -fsS -b /tmp/ogp-cookies http://127.0.0.1:8443/ -o /tmp/ogp-dashboard.html
          grep -q "Open Go Panel is running" /tmp/ogp-dashboard.html
          curl -fsS -b /tmp/ogp-cookies http://127.0.0.1:8443/terminal -o /tmp/ogp-terminal.html
          grep -q "/assets/xterm/xterm.js" /tmp/ogp-terminal.html
          if grep -q "cdn.jsdelivr.net" /tmp/ogp-terminal.html; then
            echo "Terminal still references a runtime CDN" >&2
            exit 1
          fi
          curl -fsS -b /tmp/ogp-cookies http://127.0.0.1:8443/assets/xterm/xterm.js >/dev/null
          curl -fsS -b /tmp/ogp-cookies http://127.0.0.1:8443/docker -o /tmp/ogp-docker.html
          grep -q "<h1>Docker</h1>" /tmp/ogp-docker.html

          CSRF="$(curl -fsS -b /tmp/ogp-cookies http://127.0.0.1:8443/ | grep -o 'name="ogp_csrf" value="[^"]*"' | head -n1 | cut -d '"' -f4)"
          test -n "$CSRF"
          USER_CODE="$(curl -sS -o /dev/null -w '%{http_code}' -b /tmp/ogp-cookies -H 'Origin: https://panel.example.com' -H 'Sec-Fetch-Site: same-origin' --data-urlencode "ogp_csrf=$CSRF" -d 'username=ogpsmoke&password=SmokePass123!' http://127.0.0.1:8443/users)"
          test "$USER_CODE" = "303"
          id ogpsmoke

          APP_CODE="$(curl -sS -o /dev/null -w '%{http_code}' -b /tmp/ogp-cookies --data-urlencode "ogp_csrf=$CSRF" -d 'user=ogpsmoke&name=smoke&type=static' http://127.0.0.1:8443/apps)"
          test "$APP_CODE" = "303"
          curl -fsS -b /tmp/ogp-cookies http://127.0.0.1:8443/apps -o /tmp/ogp-apps.html
          grep -q "smoke" /tmp/ogp-apps.html

          # The first app on this fresh runner has ID 1.
          curl -fsS -b /tmp/ogp-cookies http://127.0.0.1:8443/apps/1/files -o /tmp/ogp-app-files.html
          grep -q "Upload file" /tmp/ogp-app-files.html
          printf 'file-manager-smoke' > /tmp/ogp-file-upload.txt
          FILE_UPLOAD_CODE="$(curl -sS -o /dev/null -w '%{http_code}' -b /tmp/ogp-cookies -F "ogp_csrf=$CSRF" -F "action=upload" -F 'dir=' -F 'client_size=18' -F 'file=@/tmp/ogp-file-upload.txt' http://127.0.0.1:8443/apps/1/files)"
          test "$FILE_UPLOAD_CODE" = "303"
          APP_ROOT="$(getent passwd ogpsmoke | cut -d: -f6)/apps/smoke"
          test "$(stat -c '%u:%g' "$APP_ROOT/ogp-file-upload.txt")" = "$(id -u ogpsmoke):$(id -g ogpsmoke)"
          test "$(stat -c '%a' "$APP_ROOT/ogp-file-upload.txt")" = "640"
          curl -fsS -b /tmp/ogp-cookies 'http://127.0.0.1:8443/apps/1/files/download?name=ogp-file-upload.txt' | grep -qx 'file-manager-smoke'

          # ZIP upload and extraction must preserve the full archive bytes
          # through multipart parsing and the unprivileged helper process.
          mkdir -p /tmp/ogp-zip-source/demo
          printf '<?php echo "uploaded";\n' > /tmp/ogp-zip-source/demo/index.php
          (cd /tmp/ogp-zip-source && zip -q /tmp/ogp-smoke.zip demo/index.php)
          ZIP_UPLOAD="$(curl -sS -o /dev/null -w '%{http_code}' -b /tmp/ogp-cookies -F "ogp_csrf=$CSRF" -F 'action=upload' -F 'dir=' -F "client_size=$(stat -c %s /tmp/ogp-smoke.zip)" -F 'file=@/tmp/ogp-smoke.zip;filename=smoke.zip' http://127.0.0.1:8443/apps/1/files)"
          test "$ZIP_UPLOAD" = "303"
          test "$(sha256sum /tmp/ogp-smoke.zip | cut -d ' ' -f1)" = "$(sha256sum "$APP_ROOT/smoke.zip" | cut -d ' ' -f1)"
          ZIP_EXTRACT="$(curl -sS -o /dev/null -w '%{http_code}' -b /tmp/ogp-cookies --data-urlencode "ogp_csrf=$CSRF" -d 'action=extract&dir=&name=smoke.zip' http://127.0.0.1:8443/apps/1/files)"
          test "$ZIP_EXTRACT" = "303"
          cmp /tmp/ogp-zip-source/demo/index.php "$APP_ROOT/demo/index.php"
          # A PHP archive typically unpacks into a named top-level folder.
          # Promote its contents into the current directory without touching
          # the entire application tree or overwriting existing names.
          LIFT_CODE="$(curl -sS -o /dev/null -w '%{http_code}' -b /tmp/ogp-cookies --data-urlencode "ogp_csrf=$CSRF" -d 'action=move_contents&dir=&name=demo' http://127.0.0.1:8443/apps/1/files)"
          test "$LIFT_CODE" = "303"
          cmp /tmp/ogp-zip-source/demo/index.php "$APP_ROOT/index.php"
          test ! -e "$APP_ROOT/demo/index.php"

          # Select two files in a single operation. They are moved using the
          # application's Linux identity and never replace target files.
          for filename in bulk-first.txt bulk-second.txt; do
            CREATE_BULK="$(curl -sS -o /dev/null -w '%{http_code}' -b /tmp/ogp-cookies --data-urlencode "ogp_csrf=$CSRF" --data-urlencode "name=$filename" --data-urlencode "content=$filename" -d 'action=create&dir=' http://127.0.0.1:8443/apps/1/files)"
            test "$CREATE_BULK" = "303"
          done
          mkdir_code="$(curl -sS -o /dev/null -w '%{http_code}' -b /tmp/ogp-cookies --data-urlencode "ogp_csrf=$CSRF" -d 'action=mkdir&dir=&name=assets' http://127.0.0.1:8443/apps/1/files)"
          test "$mkdir_code" = "303"
          BULK_MOVE="$(curl -sS -o /dev/null -w '%{http_code}' -b /tmp/ogp-cookies --data-urlencode "ogp_csrf=$CSRF" --data-urlencode 'selected=bulk-first.txt' --data-urlencode 'selected=bulk-second.txt' -d 'action=bulk_move&dir=&destination=assets' http://127.0.0.1:8443/apps/1/files)"
          test "$BULK_MOVE" = "303"
          test -f "$APP_ROOT/assets/bulk-first.txt"
          test -f "$APP_ROOT/assets/bulk-second.txt"
          test ! -e "$APP_ROOT/bulk-first.txt"
          BULK_DELETE="$(curl -sS -o /dev/null -w '%{http_code}' -b /tmp/ogp-cookies --data-urlencode "ogp_csrf=$CSRF" --data-urlencode 'selected=bulk-first.txt' --data-urlencode 'selected=bulk-second.txt' -d 'action=bulk_delete&dir=assets' http://127.0.0.1:8443/apps/1/files)"
          test "$BULK_DELETE" = "303"
          test ! -e "$APP_ROOT/assets/bulk-first.txt"
          test ! -e "$APP_ROOT/assets/bulk-second.txt"

          # The multipart parser must reject an incomplete transfer based on
          # the size selected by the browser, without leaving a file behind.
          WRONG_SIZE_CODE="$(curl -sS -o /dev/null -w '%{http_code}' -b /tmp/ogp-cookies -F "ogp_csrf=$CSRF" -F 'action=upload' -F 'dir=' -F 'client_size=1' -F 'file=@/tmp/ogp-smoke.zip;filename=wrong-size.zip' http://127.0.0.1:8443/apps/1/files)"
          test "$WRONG_SIZE_CODE" = "400"
          test ! -e "$APP_ROOT/wrong-size.zip"

          # Stress the same multipart-to-runuser path with an actual 192 MiB
          # binary file (larger than the former 128 MiB cap). Its digest must
          # exactly match the original bytes on disk.
          dd if=/dev/urandom of=/tmp/ogp-large-upload.bin bs=1M count=192 status=none
          BIG_SIZE="$(stat -c %s /tmp/ogp-large-upload.bin)"
          BIG_UPLOAD="$(curl -sS -o /dev/null -w '%{http_code}' -b /tmp/ogp-cookies -F "ogp_csrf=$CSRF" -F 'action=upload' -F 'dir=' -F "client_size=$BIG_SIZE" -F 'file=@/tmp/ogp-large-upload.bin;filename=large-upload.bin' http://127.0.0.1:8443/apps/1/files)"
          test "$BIG_UPLOAD" = "303"
          test "$(sha256sum /tmp/ogp-large-upload.bin | cut -d ' ' -f1)" = "$(sha256sum "$APP_ROOT/large-upload.bin" | cut -d ' ' -f1)"
          move_code="$(curl -sS -o /dev/null -w '%{http_code}' -b /tmp/ogp-cookies --data-urlencode "ogp_csrf=$CSRF" -d 'action=move&dir=&name=ogp-file-upload.txt&destination=assets/test.txt' http://127.0.0.1:8443/apps/1/files)"
          test "$move_code" = "303"
          curl -fsS -b /tmp/ogp-cookies 'http://127.0.0.1:8443/apps/1/files/download?dir=assets&name=test.txt' | grep -qx 'file-manager-smoke'
          FILE_HASH="$(curl -fsS -b /tmp/ogp-cookies 'http://127.0.0.1:8443/apps/1/files?dir=assets&edit=test.txt' | grep -o 'name="base_sha256" value="[0-9a-f]*"' | head -n1 | cut -d '"' -f4)"
          test -n "$FILE_HASH"
          SAVE_CODE="$(curl -sS -o /dev/null -w '%{http_code}' -b /tmp/ogp-cookies --data-urlencode "ogp_csrf=$CSRF" -d 'action=save&dir=assets&name=test.txt' --data-urlencode "base_sha256=$FILE_HASH" --data-urlencode 'content=updated-file' http://127.0.0.1:8443/apps/1/files)"
          test "$SAVE_CODE" = "303"
          curl -fsS -b /tmp/ogp-cookies 'http://127.0.0.1:8443/apps/1/files/download?dir=assets&name=test.txt' | grep -qx 'updated-file'
          STALE_CODE="$(curl -sS -o /dev/null -w '%{http_code}' -b /tmp/ogp-cookies --data-urlencode "ogp_csrf=$CSRF" -d 'action=save&dir=assets&name=test.txt' --data-urlencode "base_sha256=$FILE_HASH" --data-urlencode 'content=stale-overwrite' http://127.0.0.1:8443/apps/1/files)"
          test "$STALE_CODE" = "400"
          curl -fsS -b /tmp/ogp-cookies 'http://127.0.0.1:8443/apps/1/files/download?dir=assets&name=test.txt' | grep -qx 'updated-file'

          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y redis-server redis-tools mysql-server php-fpm php-cli
          sudo systemctl enable --now redis-server.service mysql.service
          # GitHub runner MySQL has a password-protected root account.
          # Supply the runner's disposable credential only to the test panel
          # process, rather than changing MySQL auth or production DB code.
          test "$(sudo env MYSQL_PWD=root mysql --protocol=socket -uroot -N -e 'SELECT 1')" = "1"
          sudo mkdir -p /etc/systemd/system/open-go-panel.service.d
          { echo '[Service]'; echo 'Environment=MYSQL_PWD=root'; } | sudo tee /etc/systemd/system/open-go-panel.service.d/smoke-mysql.conf >/dev/null
          sudo systemctl daemon-reload
          sudo systemctl restart open-go-panel.service
          sleep 5
          curl -fsS http://127.0.0.1:8443/health | grep -qx ok
          # Panel sessions are in-memory and intentionally expire on restart.
          LOGIN_CODE="$(curl -sS -o /dev/null -w '%{http_code}' -c /tmp/ogp-cookies -d "username=admin&password=$PASS" http://127.0.0.1:8443/login)"
          test "$LOGIN_CODE" = "303"
          CSRF="$(curl -fsS -b /tmp/ogp-cookies http://127.0.0.1:8443/ | grep -o 'name="ogp_csrf" value="[^"]*"' | head -n1 | cut -d '"' -f4)"
          test -n "$CSRF"
          curl -fsS -b /tmp/ogp-cookies http://127.0.0.1:8443/databases/redis -o /tmp/ogp-redis.html
          grep -q "<h1>Redis</h1>" /tmp/ogp-redis.html

          # Install an extension using the panel's PHP-version-aware route.
          PHP_VERSION="$(php -r 'echo PHP_MAJOR_VERSION.".".PHP_MINOR_VERSION;')"
          echo "PHP extensions smoke: detected PHP $PHP_VERSION"
          curl -fsS -b /tmp/ogp-cookies http://127.0.0.1:8443/software -o /tmp/ogp-software-php.html
          grep -q "Manage PHP $PHP_VERSION extensions" /tmp/ogp-software-php.html
          EXT_CODE="$(curl -sS -o /dev/null -w '%{http_code}' -b /tmp/ogp-cookies --data-urlencode "ogp_csrf=$CSRF" http://127.0.0.1:8443/software/php/extensions/bcmath)"
          test "$EXT_CODE" = "303"
          EXT_READY=""
          for _ in $(seq 1 90); do
            if test -e "/etc/php/$PHP_VERSION/fpm/conf.d/20-bcmath.ini"; then EXT_READY=yes; break; fi
            sleep 2
          done
          test "$EXT_READY" = yes
          php -m | grep -iq '^bcmath'
          echo "PHP extensions smoke: BCMath package enabled"
          curl -fsS -b /tmp/ogp-cookies http://127.0.0.1:8443/software -o /tmp/ogp-software-php.html
          grep -q "BCMath" /tmp/ogp-software-php.html
          # Package symlinks appear before apt and FPM reload complete; wait
          # for the Software task to release its installation lock.
          for _ in $(seq 1 100); do
            curl -fsS -b /tmp/ogp-cookies http://127.0.0.1:8443/software -o /tmp/ogp-software-php.html
            if ! grep -q '<span class="status-badge warn">running</span>' /tmp/ogp-software-php.html; then break; fi
            sleep 1
          done
          if grep -q 'install extension.*:' /tmp/ogp-software-php.html; then
            echo "PHP extensions smoke: BCMath install failed" >&2
            exit 1
          fi

          # End-to-end SQL file import using the managed MySQL database user.
          echo "SQL smoke: creating managed MySQL database"
          DB_CODE="$(curl -sS -o /tmp/ogp-db-create-response.html -w '%{http_code}' -b /tmp/ogp-cookies --data-urlencode "ogp_csrf=$CSRF" -d 'engine=mysql&name=smokeimport&user=smokeimportuser' http://127.0.0.1:8443/databases)"
          echo "SQL smoke: DB create HTTP=$DB_CODE"
          if [ "$DB_CODE" != "303" ]; then
            grep -o '<div class="alert">[^<]*' /tmp/ogp-db-create-response.html | head -n1 | cut -c 1-450 || true
            echo "SQL smoke: mysql binary and service diagnostics"
            command -v mysql || true
            systemctl is-active mysql.service || true
            exit 1
          fi
          curl -fsS -b /tmp/ogp-cookies http://127.0.0.1:8443/databases -o /tmp/ogp-databases.html
          grep -q '/databases/1/import/file' /tmp/ogp-databases.html
          printf "CREATE TABLE import_check (id INT PRIMARY KEY, text_value VARCHAR(32)); INSERT INTO import_check VALUES (1, 'upload-ok');\n" > /tmp/ogp-upload.sql
          SQL_CODE="$(curl -sS -o /dev/null -w '%{http_code}' -b /tmp/ogp-cookies -F "ogp_csrf=$CSRF" -F 'mode=apply' -F 'file=@/tmp/ogp-upload.sql;filename=import.sql' http://127.0.0.1:8443/databases/1/import/file)"
          echo "SQL smoke: upload HTTP=$SQL_CODE"
          test "$SQL_CODE" = "303"
          SQL_STATE=""
          for _ in $(seq 1 40); do
            SQL_STATE="$(curl -fsS -b /tmp/ogp-cookies http://127.0.0.1:8443/databases)"
            if grep -q "SQL file import completed" <<< "$SQL_STATE"; then break; fi
            if grep -q "SQL file import failed" <<< "$SQL_STATE"; then echo "SQL upload import failed" >&2; exit 1; fi
            sleep 2
          done
          echo "SQL smoke: apply status checked"
          grep -q "SQL file import completed" <<< "$SQL_STATE"
          echo "SQL smoke: checking imported table"
          test "$(sudo env MYSQL_PWD=root mysql --protocol=socket -uroot -N -e 'SELECT text_value FROM smokeimport.import_check WHERE id=1')" = 'upload-ok'

          printf "CREATE TABLE replaced_check (id INT PRIMARY KEY); INSERT INTO replaced_check VALUES (42);\n" | gzip > /tmp/ogp-replace.sql.gz
          SQL_CODE="$(curl -sS -o /dev/null -w '%{http_code}' -b /tmp/ogp-cookies -F "ogp_csrf=$CSRF" -F 'mode=replace' -F 'file=@/tmp/ogp-replace.sql.gz;filename=replace.sql.gz' http://127.0.0.1:8443/databases/1/import/file)"
          echo "SQL smoke: upload HTTP=$SQL_CODE"
          test "$SQL_CODE" = "303"
          SQL_STATE=""
          for _ in $(seq 1 40); do
            SQL_STATE="$(curl -fsS -b /tmp/ogp-cookies http://127.0.0.1:8443/databases)"
            if grep -q "SQL file import completed" <<< "$SQL_STATE"; then break; fi
            if grep -q "SQL file import failed" <<< "$SQL_STATE"; then echo "Compressed SQL replace failed" >&2; exit 1; fi
            sleep 2
          done
          grep -q "SQL file import completed" <<< "$SQL_STATE"
          echo "SQL smoke: checking replaced table"
          test "$(sudo env MYSQL_PWD=root mysql --protocol=socket -uroot -N -e 'SELECT id FROM smokeimport.replaced_check')" = "42"
          test "$(sudo env MYSQL_PWD=root mysql --protocol=socket -uroot -N -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='smokeimport' AND table_name='import_check'")" = "0"

      - name: Verify automatic binary rollback
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p broken-dist
          printf '#!/usr/bin/env bash\nexit 42\n' > broken-dist/open-go-panel-linux-amd64
          chmod 0755 broken-dist/open-go-panel-linux-amd64
          cp smoke-dist/xterm.css smoke-dist/xterm.js smoke-dist/xterm-addon-fit.js broken-dist/
          (cd broken-dist && sha256sum open-go-panel-linux-amd64 xterm.css xterm.js xterm-addon-fit.js > SHA256SUMS)
          python3 -m http.server 18081 --directory broken-dist >/tmp/ogp-broken-http.log 2>&1 &
          sleep 1
          if sudo env \
            OGP_BINARY_URL=http://127.0.0.1:18081/open-go-panel-linux-amd64 \
            OGP_CHECKSUMS_URL=http://127.0.0.1:18081/SHA256SUMS \
            OGP_ASSET_BASE_URL=http://127.0.0.1:18081 \
            bash ./install.sh; then
            echo "Broken update unexpectedly succeeded" >&2
            exit 1
          fi
          sleep 1
          curl -fsS http://127.0.0.1:8443/health | grep -qx ok

      - name: Close panel through UI and reopen through SSH command
        shell: bash
        run: |
          set -euo pipefail
          PASS="$(sudo sed -n 's/^OGP_ADMIN_PASSWORD=//p' /etc/open-go-panel/open-go-panel.env | head -n1)"
          LOGIN_CODE="$(curl -sS -o /dev/null -w '%{http_code}' -c /tmp/ogp-close-cookies -d "username=admin&password=$PASS" http://127.0.0.1:8443/login)"
          test "$LOGIN_CODE" = "303"
          CSRF="$(curl -fsS -b /tmp/ogp-close-cookies http://127.0.0.1:8443/ | grep -o 'name="ogp_csrf" value="[^"]*"' | head -n1 | cut -d '"' -f4)"
          test -n "$CSRF"
          curl -fsS -b /tmp/ogp-close-cookies --data-urlencode "ogp_csrf=$CSRF" -o /tmp/ogp-close-response.html http://127.0.0.1:8443/panel/close
          grep -q "Panel is closing" /tmp/ogp-close-response.html
          for _ in $(seq 1 25); do
            if ! sudo systemctl is-active --quiet open-go-panel.service; then
              break
            fi
            sleep 1
          done
          if sudo systemctl is-active --quiet open-go-panel.service; then
            echo "Panel service did not stop" >&2
            exit 1
          fi
          test "$(sudo systemctl is-enabled open-go-panel.service)" = "disabled"
          if curl -fsS --max-time 2 http://127.0.0.1:8443/health; then
            echo "Panel port is still listening" >&2
            exit 1
          fi
          sudo systemctl start open-go-panel.service
          for _ in $(seq 1 20); do
            if curl -fsS --max-time 2 http://127.0.0.1:8443/health | grep -qx ok; then
              exit 0
            fi
            sleep 1
          done
          echo "Panel did not reopen using the SSH systemctl command" >&2
          exit 1
