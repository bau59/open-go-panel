name: production-smoke

on:
  push:
    branches:
      - main
    paths:
      - "install.sh"
      - "cmd/panel/**"
      - "internal/app/**"
      - "internal/dbmanager/**"
      - "internal/docker/**"
      - "internal/server/**"
      - "internal/state/**"
      - "internal/terminal/**"
      - ".github/workflows/smoke.yml"
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build smoke artifacts
        run: |
          mkdir -p smoke-dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -o smoke-dist/open-go-panel-linux-amd64 ./cmd/panel
          curl -fsSL https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css -o smoke-dist/xterm.css
          curl -fsSL https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.js -o smoke-dist/xterm.js
          curl -fsSL https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.js -o smoke-dist/xterm-addon-fit.js
          (cd smoke-dist && sha256sum open-go-panel-linux-amd64 xterm.css xterm.js xterm-addon-fit.js > SHA256SUMS)

      - name: Run local artifact server
        run: |
          python3 -m http.server 18080 --directory smoke-dist >/tmp/ogp-smoke-http.log 2>&1 &
          echo $! > /tmp/ogp-smoke-http.pid
          sleep 1
          curl -fsS http://127.0.0.1:18080/SHA256SUMS

      - name: Install current build
        run: |
          sudo env \
            OGP_BINARY_URL=http://127.0.0.1:18080/open-go-panel-linux-amd64 \
            OGP_CHECKSUMS_URL=http://127.0.0.1:18080/SHA256SUMS \
            OGP_ASSET_BASE_URL=http://127.0.0.1:18080 \
            bash ./install.sh

      - name: Exercise panel
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS http://127.0.0.1:8443/health | grep -qx ok
          PASS="$(sudo sed -n 's/^OGP_ADMIN_PASSWORD=//p' /etc/open-go-panel/open-go-panel.env | head -n1)"
          LOGIN_CODE="$(curl -sS -o /dev/null -w '%{http_code}' -c /tmp/ogp-cookies -d "username=admin&password=$PASS" http://127.0.0.1:8443/login)"
          test "$LOGIN_CODE" = "303"
          curl -fsS -b /tmp/ogp-cookies http://127.0.0.1:8443/ | grep -q "Open Go Panel is running"
          curl -fsS -b /tmp/ogp-cookies http://127.0.0.1:8443/terminal | grep -q "/assets/xterm/xterm.js"
          if curl -fsS -b /tmp/ogp-cookies http://127.0.0.1:8443/terminal | grep -q "cdn.jsdelivr.net"; then
            echo "Terminal still references a runtime CDN" >&2
            exit 1
          fi
          curl -fsS -b /tmp/ogp-cookies http://127.0.0.1:8443/assets/xterm/xterm.js >/dev/null
          curl -fsS -b /tmp/ogp-cookies http://127.0.0.1:8443/docker | grep -q "<h1>Docker</h1>"

          USER_CODE="$(curl -sS -o /dev/null -w '%{http_code}' -b /tmp/ogp-cookies -d 'username=ogpsmoke&password=SmokePass123!' http://127.0.0.1:8443/users)"
          test "$USER_CODE" = "303"
          id ogpsmoke

          APP_CODE="$(curl -sS -o /dev/null -w '%{http_code}' -b /tmp/ogp-cookies -d 'user=ogpsmoke&name=smoke&type=static' http://127.0.0.1:8443/apps)"
          test "$APP_CODE" = "303"
          curl -fsS -b /tmp/ogp-cookies http://127.0.0.1:8443/apps | grep -q "smoke"

          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y redis-server redis-tools
          sudo systemctl enable --now redis-server.service
          curl -fsS -b /tmp/ogp-cookies http://127.0.0.1:8443/databases/redis | grep -q "<h1>Redis</h1>"

      - name: Verify automatic binary rollback
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p broken-dist
          printf '#!/usr/bin/env bash\nexit 42\n' > broken-dist/open-go-panel-linux-amd64
          chmod 0755 broken-dist/open-go-panel-linux-amd64
          cp smoke-dist/xterm.css smoke-dist/xterm.js smoke-dist/xterm-addon-fit.js broken-dist/
          (cd broken-dist && sha256sum open-go-panel-linux-amd64 xterm.css xterm.js xterm-addon-fit.js > SHA256SUMS)
          python3 -m http.server 18081 --directory broken-dist >/tmp/ogp-broken-http.log 2>&1 &
          sleep 1
          if sudo env \
            OGP_BINARY_URL=http://127.0.0.1:18081/open-go-panel-linux-amd64 \
            OGP_CHECKSUMS_URL=http://127.0.0.1:18081/SHA256SUMS \
            OGP_ASSET_BASE_URL=http://127.0.0.1:18081 \
            bash ./install.sh; then
            echo "Broken update unexpectedly succeeded" >&2
            exit 1
          fi
          sleep 1
          curl -fsS http://127.0.0.1:8443/health | grep -qx ok