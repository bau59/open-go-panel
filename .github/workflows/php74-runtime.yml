name: php74-runtime

on:
  pull_request:
    paths:
      - "internal/phpfpm/php74.Dockerfile"
      - "internal/phpfpm/legacy.go"
      - ".github/workflows/php74-runtime.yml"
  workflow_dispatch:

jobs:
  legacy-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build isolated PHP 7.4 image
        run: docker build -f internal/phpfpm/php74.Dockerfile -t open-go-panel/php74:test internal/phpfpm
      - name: Verify required extensions
        run: |
          set -euo pipefail
          docker run --rm open-go-panel/php74:test php -v | grep -q "PHP 7.4"
          modules="$(docker run --rm open-go-panel/php74:test php -m | tr '[:upper:]' '[:lower:]')"
          for module in curl gd imagick intl mbstring mysqli openssl pdo pdo_mysql zip; do
            printf '%s\n' "$modules" | grep -qx "$module"
          done
      - name: Check PHP-FPM config
        run: docker run --rm open-go-panel/php74:test php-fpm -t
