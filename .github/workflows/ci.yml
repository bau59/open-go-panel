name: ci

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Resolve modules
        run: go mod tidy

      - name: Module snapshot
        run: |
          echo "BEGIN_GO_MOD"
          cat go.mod
          echo "END_GO_MOD"
          echo "BEGIN_GO_SUM"
          cat go.sum
          echo "END_GO_SUM"

      - name: Test
        run: go test ./...

      - name: Build
        run: go build ./cmd/panel
